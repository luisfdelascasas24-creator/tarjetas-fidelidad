<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e4572e">
<title>Mi tarjeta de fidelidad</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div id="loading" class="card"><p class="muted">Cargando…</p></div>
  <div id="error" class="card hidden"><div id="errorText" class="msg err"></div></div>

  <!-- Registro -->
  <div id="registerView" class="hidden">
    <div class="head" id="regHead"></div>
    <div class="card">
      <h2>Crea tu tarjeta</h2>
      <p class="muted" id="regPromo"></p>
      <label for="name">Tu nombre</label>
      <input id="name" autocomplete="name" maxlength="60" placeholder="Ej: María">
      <label for="contact">Correo o teléfono (opcional)</label>
      <input id="contact" autocomplete="email" maxlength="80" placeholder="Para recuperar tu tarjeta">
      <label class="check"><input type="checkbox" id="accepts"> Acepto recibir promociones de este local</label>
      <button id="registerBtn">Crear mi tarjeta</button>
      <div id="regMsg"></div>
    </div>
  </div>

  <!-- Tarjeta -->
  <div id="cardView" class="hidden">
    <div class="head" id="cardHead"></div>
    <div class="card">
      <p class="big" id="hello"></p>
      <div class="stamps" id="stamps"></div>
      <p class="big" id="progress"></p>
      <div id="readyBox" class="ready hidden"></div>
      <div class="qr" id="qr"></div>
      <div class="code" id="code"></div>
      <p class="muted" style="text-align:center">Muestra este código en caja para sumar tus sellos.</p>
    </div>
    <div class="card"><p class="muted" style="text-align:center;margin:0">Tip: agrega esta página a la pantalla de inicio de tu celular para tener la tarjeta a mano.</p></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script src="api.js"></script>
<script>
const slug = param("r");
const KEY = "tarjeta_" + slug;
let token = null, qrDone = false, timer = null;
const $ = id => document.getElementById(id);

function show(id) {
  ["loading", "error", "registerView", "cardView"].forEach(v => $(v).classList.toggle("hidden", v !== id));
}
function fail(text) { $("errorText").textContent = text; show("error"); }

function headHtml(t, name) {
  document.title = name;
  const logo = safeUrl(t.logo_url);
  return (logo ? '<img src="' + esc(logo) + '" alt="">' : "") + "<h1>" + esc(name) + "</h1>" +
    (t.welcome_text ? '<p class="welcome">' + esc(t.welcome_text) + "</p>" : "");
}

async function init() {
  if (!slug) return fail("Link inválido. Escanea de nuevo el código del local.");
  try { token = localStorage.getItem(KEY); } catch (e) {}
  try {
    if (token) {
      const c = await rpc("get_card", { p_token: token });
      if (c.ok) return renderCard(c);
      try { localStorage.removeItem(KEY); } catch (e) {}
      token = null;
    }
    const r = await rpc("get_restaurant", { p_slug: slug });
    if (!r.ok) return fail(r.error);
    applyTheme(r);
    $("regHead").innerHTML = headHtml(r, r.name);
    $("regPromo").textContent = "Junta " + r.stamps_required + " sellos y llévate: " + r.reward;
    show("registerView");
  } catch (e) { fail(e.message); }
}

$("registerBtn").addEventListener("click", async () => {
  const btn = $("registerBtn");
  btn.disabled = true;
  $("regMsg").innerHTML = "";
  try {
    const r = await rpc("register_customer", {
      p_slug: slug, p_name: $("name").value, p_contact: $("contact").value, p_accepts: $("accepts").checked
    });
    if (!r.ok) throw new Error(r.error);
    try { localStorage.setItem(KEY, r.token); } catch (e) {}
    token = r.token;
    const c = await rpc("get_card", { p_token: token });
    if (!c.ok) throw new Error(c.error);
    renderCard(c);
  } catch (e) {
    $("regMsg").innerHTML = '<div class="msg err">' + esc(e.message) + "</div>";
  }
  btn.disabled = false;
});

function renderCard(c) {
  applyTheme(c);
  $("cardHead").innerHTML = headHtml(c, c.restaurant_name);
  $("hello").textContent = "Hola, " + c.name;
  const icon = esc(c.stamp_icon || "★");
  $("stamps").innerHTML = Array.from({ length: c.stamps_required }, (_, i) =>
    '<div class="stamp ' + (i < c.stamps ? "on" : "") + '"><span class="ic">' + icon + "</span></div>").join("");
  const left = c.stamps_required - c.stamps;
  $("progress").textContent = c.ready ? c.stamps + " de " + c.stamps_required + " sellos"
    : "Te faltan " + left + (left === 1 ? " sello" : " sellos") + " para tu premio";
  const rb = $("readyBox");
  rb.classList.toggle("hidden", !c.ready);
  rb.textContent = "¡Premio listo! " + c.reward + ". Pídelo en caja.";
  $("code").textContent = c.code;
  if (!qrDone) {
    try { new QRCode($("qr"), { text: c.token, width: 200, height: 200 }); qrDone = true; } catch (e) {}
  }
  show("cardView");
  if (!timer) {
    timer = setInterval(async () => {
      if (document.hidden || !token) return;
      try { const n = await rpc("get_card", { p_token: token }); if (n.ok) renderCard(n); } catch (e) {}
    }, 10000);
  }
}

init();
</script>
</body>
</html>
