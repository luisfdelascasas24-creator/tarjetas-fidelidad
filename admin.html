<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Administrador</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap wide">
  <div id="loginView" class="card" style="max-width:480px;margin:40px auto">
    <h1>Administrador</h1>
    <label for="adminPass">Clave de administrador</label>
    <input id="adminPass" type="password" autocomplete="current-password">
    <button id="loginBtn">Entrar</button>
    <div id="loginMsg"></div>
  </div>

  <div id="mainView" class="hidden">
    <div class="card">
      <h2>Nuevo restaurante</h2>
      <div class="row2">
        <div><label for="name">Nombre del local</label><input id="name" placeholder="Ej: Café Central"></div>
        <div><label for="slug">Identificador (para el link)</label><input id="slug" placeholder="ej: cafe-central"></div>
      </div>
      <div class="row2">
        <div><label for="required">Sellos para el premio</label><input id="required" type="number" min="2" max="30" value="8"></div>
        <div><label for="minHours">Horas mínimas entre sellos</label><input id="minHours" type="number" min="0" value="6"></div>
      </div>
      <label for="reward">Premio</label>
      <input id="reward" placeholder="Ej: Un café gratis">
      <div class="row2">
        <div><label for="color">Color de la tarjeta</label><input id="color" type="color" value="#e4572e" style="height:46px;padding:4px"></div>
        <div><label for="pin">PIN del panel (mínimo 4 dígitos)</label><input id="pin" inputmode="numeric" placeholder="Ej: 4821"></div>
      </div>
      <label for="logo">Link del logo (opcional)</label>
      <input id="logo" placeholder="https://…/logo.png">
      <button id="createBtn">Crear restaurante</button>
      <div id="createMsg"></div>
    </div>

    <div class="card">
      <h2>Restaurantes</h2>
      <div id="list"><p class="muted">Cargando…</p></div>
    </div>
    <button class="secondary" id="logoutBtn" style="max-width:200px">Salir</button>
  </div>
</div>

<div id="qrModal" class="modal hidden">
  <div class="card">
    <h2 id="qrTitle"></h2>
    <div class="qr" id="qrBox"></div>
    <p class="muted" id="qrLink" style="word-break:break-all"></p>
    <a id="qrDownload" class="btn" download="qr.png">Descargar QR</a>
    <button class="secondary" id="qrClose">Cerrar</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script src="api.js"></script>
<script>
const AKEY = "admin_pass";
let pass = "", restaurants = [];
const $ = id => document.getElementById(id);

async function login(p) {
  const r = await rpc("admin_list", { p_admin: p });
  if (!r.ok) throw new Error(r.error);
  pass = p;
  try { sessionStorage.setItem(AKEY, p); } catch (e) {}
  $("loginView").classList.add("hidden");
  $("mainView").classList.remove("hidden");
  restaurants = r.restaurants;
  renderList();
}

$("loginBtn").addEventListener("click", async () => {
  $("loginMsg").innerHTML = "";
  $("loginBtn").disabled = true;
  try { await login($("adminPass").value); }
  catch (e) { $("loginMsg").innerHTML = '<div class="msg err">' + esc(e.message) + "</div>"; }
  $("loginBtn").disabled = false;
});
$("adminPass").addEventListener("keydown", e => { if (e.key === "Enter") $("loginBtn").click(); });
$("logoutBtn").addEventListener("click", () => { try { sessionStorage.removeItem(AKEY); } catch (e) {} location.reload(); });

async function refresh() {
  const r = await rpc("admin_list", { p_admin: pass });
  if (r.ok) { restaurants = r.restaurants; renderList(); }
}

function renderList() {
  if (!restaurants.length) { $("list").innerHTML = '<p class="muted">Aún no hay restaurantes. Crea el primero arriba.</p>'; return; }
  $("list").innerHTML = restaurants.map(r => {
    const card = pageUrl("card.html", r.slug), panel = pageUrl("panel.html", r.slug);
    return '<div style="border-top:1px solid var(--line);padding:12px 0">' +
      "<b>" + esc(r.name) + "</b> " + (r.active ? "" : '<span class="muted">(desactivado)</span>') +
      '<div class="muted">' + r.customers + " clientes · " + r.stamps_total + " sellos · " + r.stamps_required + " sellos = " + esc(r.reward) + "</div>" +
      '<div class="actions">' +
      '<button class="small secondary" data-act="qr" data-slug="' + esc(r.slug) + '">QR de la tarjeta</button>' +
      '<button class="small secondary" data-act="copycard" data-url="' + esc(card) + '">Copiar link tarjeta</button>' +
      '<button class="small secondary" data-act="copypanel" data-url="' + esc(panel) + '">Copiar link panel</button>' +
      '<button class="small secondary" data-act="pin" data-slug="' + esc(r.slug) + '">Cambiar PIN</button>' +
      '<button class="small secondary" data-act="toggle" data-slug="' + esc(r.slug) + '" data-active="' + r.active + '">' + (r.active ? "Desactivar" : "Activar") + "</button>" +
      "</div></div>";
  }).join("");
}

$("list").addEventListener("click", async e => {
  const b = e.target.closest("button[data-act]");
  if (!b) return;
  const act = b.dataset.act;
  try {
    if (act === "qr") showQr(b.dataset.slug);
    else if (act === "copycard" || act === "copypanel") {
      await navigator.clipboard.writeText(b.dataset.url);
      b.textContent = "¡Copiado!";
      setTimeout(() => { b.textContent = act === "copycard" ? "Copiar link tarjeta" : "Copiar link panel"; }, 1500);
    } else if (act === "pin") {
      const p = prompt("Nuevo PIN (mínimo 4 dígitos):");
      if (!p) return;
      const r = await rpc("admin_set_pin", { p_admin: pass, p_slug: b.dataset.slug, p_pin: p });
      alert(r.ok ? "PIN actualizado" : r.error);
    } else if (act === "toggle") {
      const r = await rpc("admin_set_active", { p_admin: pass, p_slug: b.dataset.slug, p_active: b.dataset.active !== "true" });
      if (!r.ok) alert(r.error);
      refresh();
    }
  } catch (err) { alert(err.message); }
});

function showQr(slug) {
  const url = pageUrl("card.html", slug);
  $("qrTitle").textContent = "QR: " + slug;
  $("qrLink").textContent = url;
  $("qrBox").innerHTML = "";
  new QRCode($("qrBox"), { text: url, width: 256, height: 256, correctLevel: QRCode.CorrectLevel.M });
  setTimeout(() => {
    const cv = $("qrBox").querySelector("canvas");
    if (cv) { $("qrDownload").href = cv.toDataURL("image/png"); $("qrDownload").download = "qr-" + slug + ".png"; }
  }, 200);
  $("qrModal").classList.remove("hidden");
}
$("qrClose").addEventListener("click", () => $("qrModal").classList.add("hidden"));

$("createBtn").addEventListener("click", async () => {
  $("createMsg").innerHTML = "";
  $("createBtn").disabled = true;
  try {
    const r = await rpc("admin_create_restaurant", {
      p_admin: pass, p_slug: $("slug").value, p_name: $("name").value, p_color: $("color").value,
      p_required: parseInt($("required").value, 10) || 8, p_reward: $("reward").value,
      p_min_hours: parseInt($("minHours").value, 10) || 0, p_pin: $("pin").value, p_logo_url: $("logo").value
    });
    if (!r.ok) throw new Error(r.error);
    $("createMsg").innerHTML = '<div class="msg ok">Restaurante creado. Ya aparece en la lista de abajo.</div>';
    ["name", "slug", "reward", "pin", "logo"].forEach(id => $(id).value = "");
    refresh();
  } catch (e) { $("createMsg").innerHTML = '<div class="msg err">' + esc(e.message) + "</div>"; }
  $("createBtn").disabled = false;
});

try { const s = sessionStorage.getItem(AKEY); if (s) login(s).catch(() => {}); } catch (e) {}
</script>
</body>
</html>
