<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel del restaurante</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <!-- Login -->
  <div id="loginView" class="card">
    <h1>Panel del restaurante</h1>
    <p class="muted" id="loginSub">Ingresa el PIN de tu local.</p>
    <label for="pin">PIN</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••">
    <button id="loginBtn">Entrar</button>
    <div id="loginMsg"></div>
  </div>

  <!-- Panel -->
  <div id="panelView" class="hidden">
    <div class="head"><h1 id="rName"></h1><div id="rInfo" style="opacity:.9"></div></div>

    <div class="card">
      <h2>Sumar sello o canjear premio</h2>
      <button id="scanBtn">📷 Escanear QR del cliente</button>
      <div id="reader" class="hidden"></div>
      <button id="stopBtn" class="secondary hidden">Cerrar cámara</button>
      <label for="codeInput">O escribe el código de 6 letras</label>
      <input id="codeInput" autocapitalize="characters" maxlength="40" placeholder="Ej: K7PX2M">
      <button id="lookupBtn" class="secondary">Buscar tarjeta</button>
      <div id="customerBox" class="hidden" style="margin-top:14px"></div>
      <div id="actionMsg"></div>
    </div>

    <div class="card">
      <h2>Resumen</h2>
      <div class="grid4" id="stats"></div>
    </div>

    <div class="card">
      <h2>Clientes recientes</h2>
      <div style="overflow-x:auto"><table>
        <thead><tr><th>Nombre</th><th>Código</th><th>Sellos</th><th>Visitas</th><th>Última</th></tr></thead>
        <tbody id="recent"></tbody>
      </table></div>
    </div>
    <button class="secondary" id="logoutBtn">Salir</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="config.js"></script>
<script src="api.js"></script>
<script>
const slug = param("r");
const SKEY = "pin_" + slug;
let pin = "", scanner = null, currentCode = "", info = null;
const $ = id => document.getElementById(id);

if (!slug) $("loginSub").textContent = "Link inválido. Pide a tu proveedor el link correcto del panel.";

async function login(p) {
  const r = await rpc("panel_login", { p_slug: slug, p_pin: p });
  if (!r.ok) throw new Error(r.error);
  pin = p; info = r;
  try { sessionStorage.setItem(SKEY, p); } catch (e) {}
  document.documentElement.style.setProperty("--brand", safeColor(r.color));
  $("rName").textContent = r.name;
  $("rInfo").textContent = r.stamps_required + " sellos = " + r.reward;
  $("loginView").classList.add("hidden");
  $("panelView").classList.remove("hidden");
  loadStats();
}

$("loginBtn").addEventListener("click", async () => {
  $("loginMsg").innerHTML = "";
  $("loginBtn").disabled = true;
  try { await login($("pin").value); }
  catch (e) { $("loginMsg").innerHTML = '<div class="msg err">' + esc(e.message) + "</div>"; }
  $("loginBtn").disabled = false;
});
$("pin").addEventListener("keydown", e => { if (e.key === "Enter") $("loginBtn").click(); });

$("logoutBtn").addEventListener("click", () => {
  try { sessionStorage.removeItem(SKEY); } catch (e) {}
  stopScan();
  location.reload();
});

function msg(type, text) {
  $("actionMsg").innerHTML = '<div class="msg ' + type + '">' + esc(text) + "</div>";
}

async function lookup(code) {
  $("actionMsg").innerHTML = "";
  $("customerBox").classList.add("hidden");
  currentCode = (code || "").trim();
  if (!currentCode) return msg("err", "Escribe o escanea un código");
  try {
    const c = await rpc("panel_lookup", { p_slug: slug, p_pin: pin, p_code: currentCode });
    if (!c.ok) return msg("err", c.error);
    currentCode = c.code;
    const btn = c.ready
      ? '<button id="doBtn">🎁 Canjear premio: ' + esc(c.reward) + "</button>"
      : '<button id="doBtn">➕ Sumar sello</button>';
    $("customerBox").innerHTML =
      "<p class='big'>" + esc(c.name) + "</p><p class='big'>" + c.stamps + " / " + c.stamps_required + " sellos</p>" +
      (c.ready ? "<div class='ready'>Premio listo</div>" : "") + btn;
    $("customerBox").classList.remove("hidden");
    $("doBtn").addEventListener("click", () => act(c.ready));
  } catch (e) { msg("err", e.message); }
}

// Avisa a Google Wallet (si el cliente agregó su tarjeta) que cambió su saldo de sellos
function walletSync(code, event) {
  const c = window.APP_CONFIG || {};
  if (!c.WALLET_ENABLED) return;
  fetch(c.SUPABASE_URL + "/functions/v1/wallet", {
    method: "POST",
    headers: { "Content-Type": "application/json", apikey: c.SUPABASE_ANON_KEY },
    body: JSON.stringify({ action: "sync", slug: slug, pin: pin, code: code, event: event })
  }).catch(() => {});
}

async function act(ready) {
  $("doBtn").disabled = true;
  try {
    const r = await rpc(ready ? "panel_redeem" : "panel_add_stamp", { p_slug: slug, p_pin: pin, p_code: currentCode });
    if (!r.ok) { msg("err", r.error); $("doBtn").disabled = false; return; }
    $("customerBox").classList.add("hidden");
    $("codeInput").value = "";
    walletSync(currentCode, ready ? "redeem" : "stamp");
    if (ready) msg("ok", "Premio canjeado para " + r.name + ": " + r.reward);
    else msg("ok", "Sello sumado a " + r.name + " (" + r.stamps + "/" + r.stamps_required + ")" + (r.ready ? " — ¡premio listo!" : ""));
    loadStats();
  } catch (e) { msg("err", e.message); $("doBtn").disabled = false; }
}

$("lookupBtn").addEventListener("click", () => lookup($("codeInput").value));
$("codeInput").addEventListener("keydown", e => { if (e.key === "Enter") lookup($("codeInput").value); });

async function startScan() {
  $("reader").classList.remove("hidden");
  $("stopBtn").classList.remove("hidden");
  $("scanBtn").classList.add("hidden");
  try {
    scanner = new Html5Qrcode("reader");
    await scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 220 }, async text => {
      await stopScan();
      $("codeInput").value = text;
      lookup(text);
    });
  } catch (e) {
    await stopScan();
    msg("err", "No se pudo abrir la cámara. Revisa los permisos o escribe el código a mano.");
  }
}
async function stopScan() {
  try { if (scanner) { await scanner.stop(); scanner.clear(); } } catch (e) {}
  scanner = null;
  $("reader").classList.add("hidden");
  $("stopBtn").classList.add("hidden");
  $("scanBtn").classList.remove("hidden");
}
$("scanBtn").addEventListener("click", startScan);
$("stopBtn").addEventListener("click", stopScan);

async function loadStats() {
  try {
    const s = await rpc("panel_stats", { p_slug: slug, p_pin: pin });
    if (!s.ok) return;
    $("stats").innerHTML =
      '<div class="stat"><b>' + s.customers + "</b>Clientes</div>" +
      '<div class="stat"><b>' + s.stamps_today + "</b>Sellos hoy</div>" +
      '<div class="stat"><b>' + s.rewards_total + "</b>Premios canjeados</div>" +
      '<div class="stat"><b>' + s.inactive_30d + "</b>Sin venir hace 30 días</div>";
    $("recent").innerHTML = s.recent.length ? s.recent.map(c =>
      "<tr><td>" + esc(c.name) + "</td><td>" + esc(c.code) + "</td><td>" + c.stamps + "</td><td>" +
      c.total_visits + "</td><td>" + fmtDate(c.last_stamp_at) + "</td></tr>").join("")
      : '<tr><td colspan="5" class="muted">Aún no hay clientes</td></tr>';
  } catch (e) {}
}

// Reingreso automático durante la sesión
try {
  const saved = sessionStorage.getItem(SKEY);
  if (saved && slug) login(saved).catch(() => {});
} catch (e) {}
</script>
</body>
</html>
