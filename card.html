<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e4572e">
<title>Mi tarjeta de fidelidad</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div id="loading" class="card"><p class="muted">Cargando…</p></div>
  <div id="error" class="card hidden"><div id="errorText" class="msg err"></div></div>

  <!-- Registro -->
  <div id="registerView" class="hidden">
    <div class="head" id="regHead"></div>
    <div class="card">
      <h2>Crea tu tarjeta</h2>
      <p class="muted" id="regPromo"></p>
      <label for="name">Tu nombre</label>
      <input id="name" autocomplete="name" maxlength="60" placeholder="Ej: María">
      <label for="contact">Correo o teléfono (opcional)</label>
      <input id="contact" autocomplete="email" maxlength="80" placeholder="Para recuperar tu tarjeta">
      <label class="check"><input type="checkbox" id="accepts"> Acepto recibir promociones de este local</label>
      <p class="muted" style="margin:12px 0 0">Al crear tu tarjeta aceptas nuestra <a href="privacidad.html" target="_blank" rel="noopener">política de privacidad</a>.</p>
      <button id="registerBtn">Crear mi tarjeta</button>
      <div id="regMsg"></div>
    </div>
  </div>

  <!-- Tarjeta -->
  <div id="cardView" class="hidden">
    <div class="head" id="cardHead"></div>
    <div id="promos"></div>
    <div class="card">
      <p class="big" id="hello"></p>
      <div id="cbBox" class="hidden" style="text-align:center">
        <div class="muted">Tu saldo de cashback</div>
        <div class="cb-balance" id="cbBalance"></div>
        <p class="muted" id="cbInfo"></p>
      </div>
      <div class="stamps" id="stamps"></div>
      <p class="big" id="progress"></p>
      <div id="readyBox" class="ready hidden"></div>
      <div class="qr" id="qr"></div>
      <div class="code" id="code"></div>
      <p class="muted" style="text-align:center" id="showCode">Muestra este código en caja para sumar tus sellos.</p>
      <div id="walletWrap" class="hidden">
        <button id="walletBtn" class="wallet-img" aria-label="Agregar a Billetera de Google"><img id="walletImg" src="wallet-button.svg" alt="Agregar a Billetera de Google"><span id="walletTxt" class="hidden">Agregar a Google Wallet</span></button>
        <div id="walletMsg"></div>
      </div>
    </div>
    <div id="bday"></div>
    <div class="card"><p class="muted" style="text-align:center;margin:0">Tip: agrega esta página a la pantalla de inicio de tu celular para tener la tarjeta a mano.</p></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script src="api.js"></script>
<script>
const slug = param("r");
const KEY = "tarjeta_" + slug;
let token = null, qrDone = false, timer = null, extrasDone = false;
const $ = id => document.getElementById(id);

function show(id) {
  ["loading", "error", "registerView", "cardView"].forEach(v => $(v).classList.toggle("hidden", v !== id));
}
function fail(text) { $("errorText").textContent = text; show("error"); }
function untilDate(iso) {
  return new Date(iso).toLocaleDateString("es-CL", { timeZone: "America/Santiago", day: "2-digit", month: "2-digit" });
}

function headHtml(t, name) {
  document.title = name;
  const logo = safeUrl(t.logo_url);
  return (logo ? '<img src="' + esc(logo) + '" alt="">' : "") + "<h1>" + esc(name) + "</h1>" +
    (t.welcome_text ? '<p class="welcome">' + esc(t.welcome_text) + "</p>" : "");
}

async function init() {
  if (!slug) return fail("Link inválido. Escanea de nuevo el código del local.");
  try { token = localStorage.getItem(KEY); } catch (e) {}
  try {
    if (token) {
      const c = await rpc("get_card", { p_token: token });
      if (c.ok) return renderCard(c);
      try { localStorage.removeItem(KEY); } catch (e) {}
      token = null;
    }
    const r = await rpc("get_restaurant", { p_slug: slug });
    if (!r.ok) return fail(r.error);
    applyTheme(r);
    $("regHead").innerHTML = headHtml(r, r.name);
    let prog = null;
    try { prog = await rpc("restaurant_program", { p_slug: slug }); } catch (e) {}
    $("regPromo").textContent = prog && prog.ok && prog.mode === "cashback"
      ? "Gana " + Number(prog.cb_percent) + "% de cashback en cada compra y úsalo en la siguiente. Tu saldo dura " + prog.cb_expiry_days + " días desde tu última compra."
      : "Junta " + r.stamps_required + " sellos y llévate: " + r.reward;
    show("registerView");
  } catch (e) { fail(e.message); }
}

$("registerBtn").addEventListener("click", async () => {
  const btn = $("registerBtn");
  btn.disabled = true;
  $("regMsg").innerHTML = "";
  try {
    const r = await rpc("register_customer", {
      p_slug: slug, p_name: $("name").value, p_contact: $("contact").value, p_accepts: $("accepts").checked
    });
    if (!r.ok) throw new Error(r.error);
    try { localStorage.setItem(KEY, r.token); } catch (e) {}
    token = r.token;
    const c = await rpc("get_card", { p_token: token });
    if (!c.ok) throw new Error(c.error);
    renderCard(c);
  } catch (e) {
    $("regMsg").innerHTML = '<div class="msg err">' + esc(e.message) + "</div>";
  }
  btn.disabled = false;
});

function renderCard(c) {
  applyTheme(c);
  $("cardHead").innerHTML = headHtml(c, c.restaurant_name);
  $("promos").innerHTML = (c.promos || []).map(p =>
    '<div class="card promo"><b>' + esc(p.title) + '</b><p style="margin:6px 0 0">' + esc(p.body) +
    '</p><p class="muted" style="margin:6px 0 0">Hasta el ' + esc(untilDate(p.expires_at)) + "</p></div>").join("");
  $("hello").textContent = "Hola, " + c.name;
  const cb = c.mode === "cashback";
  $("cbBox").classList.toggle("hidden", !cb);
  ["stamps", "progress"].forEach(id => $(id).classList.toggle("hidden", cb));
  if (cb) {
    $("cbBalance").textContent = clp(c.balance);
    $("cbInfo").style.whiteSpace = "pre-line";
    $("cbInfo").textContent = ["Ganas " + Number(c.cb_percent) + "% de cada compra en saldo.",
      c.balance > 0 && c.balance_expires_at ? "Tu saldo vence el " + new Date(c.balance_expires_at).toLocaleDateString("es-CL", { timeZone: "America/Santiago", day: "2-digit", month: "2-digit", year: "numeric" }) + "." : "",
      "Puedes pagar hasta el " + c.cb_max_redeem_pct + "% de una compra con tu saldo.",
      "Si vuelves tras " + c.cb_bonus_days + " días, ganas " + Number(c.cb_bonus_percent) + "% extra."].filter(Boolean).join("\n");
    $("showCode").textContent = "Entrega este código al vendedor al comprar para sumar o usar tu saldo.";
  }
  const icon = esc(c.stamp_icon || "★");
  $("stamps").innerHTML = Array.from({ length: c.stamps_required }, (_, i) =>
    '<div class="stamp ' + (i < c.stamps ? "on" : "") + '"><span class="ic">' + icon + "</span></div>").join("");
  const left = c.stamps_required - c.stamps;
  if (!cb) $("progress").textContent = c.ready ? c.stamps + " de " + c.stamps_required + " sellos"
    : "Te faltan " + left + (left === 1 ? " sello" : " sellos") + " para tu premio";
  const rb = $("readyBox");
  rb.classList.toggle("hidden", cb || !c.ready);
  rb.textContent = "¡Premio listo! " + c.reward + ". Pídelo en caja.";
  $("code").textContent = c.code;
  const walletOn = !!(window.APP_CONFIG || {}).WALLET_ENABLED && !/iPhone|iPad|iPod/i.test(navigator.userAgent);
  $("walletWrap").classList.toggle("hidden", !walletOn);
  if (!qrDone) {
    try { new QRCode($("qr"), { text: c.token, width: 200, height: 200 }); qrDone = true; } catch (e) {}
  }
  show("cardView");
  if (!extrasDone) { extrasDone = true; loadExtras(); }
  if (!timer) {
    timer = setInterval(async () => {
      if (document.hidden || !token) return;
      try { const n = await rpc("get_card", { p_token: token }); if (n.ok) renderCard(n); } catch (e) {}
    }, 10000);
  }
}

const MONTHS = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
async function loadExtras() {
  try {
    const x = await rpc("card_extras", { p_token: token });
    if (!x.ok || !x.birthday_on || x.birthday_set) return;
    $("bday").innerHTML = '<div class="card"><h2>🎂 ¿Cuándo es tu cumpleaños?</h2>' +
      '<p class="muted">Opcional. Te avisamos antes con una sorpresa. Solo guardamos día y mes.</p>' +
      '<div class="row2"><div><label for="bDay">Día</label><select id="bDay">' +
      Array.from({ length: 31 }, (_, i) => "<option>" + (i + 1) + "</option>").join("") + "</select></div>" +
      '<div><label for="bMonth">Mes</label><select id="bMonth">' +
      MONTHS.map((m, i) => '<option value="' + (i + 1) + '">' + m + "</option>").join("") + "</select></div></div>" +
      '<button id="bSave">Guardar</button><div id="bMsg"></div></div>';
    $("bSave").addEventListener("click", async () => {
      $("bSave").disabled = true;
      try {
        const r = await rpc("set_birthday", { p_token: token, p_month: parseInt($("bMonth").value, 10), p_day: parseInt($("bDay").value, 10) });
        if (!r.ok) throw new Error(r.error);
        $("bday").innerHTML = '<div class="card"><p class="muted" style="margin:0;text-align:center">¡Listo! Te avisaremos antes de tu cumpleaños 🎉</p></div>';
      } catch (e) { $("bMsg").innerHTML = '<div class="msg err">' + esc(e.message) + "</div>"; $("bSave").disabled = false; }
    });
  } catch (e) {}
}

// Botón oficial de Google; si el archivo wallet-button.svg aún no está subido, se usa un botón de texto
function walletFallback() {
  $("walletImg").classList.add("hidden"); $("walletTxt").classList.remove("hidden");
  $("walletBtn").classList.remove("wallet-img"); $("walletBtn").classList.add("wallet-btn");
}
$("walletImg").addEventListener("error", walletFallback);
if ($("walletImg").complete && $("walletImg").naturalWidth === 0) walletFallback();
$("walletBtn").addEventListener("click", async () => {
  const btn = $("walletBtn");
  btn.disabled = true;
  $("walletMsg").innerHTML = "";
  try {
    const cfg = window.APP_CONFIG;
    const r = await fetch(cfg.SUPABASE_URL + "/functions/v1/wallet", {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: cfg.SUPABASE_ANON_KEY },
      body: JSON.stringify({ action: "save", token: token })
    });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "No se pudo preparar la tarjeta");
    location.href = j.url;
  } catch (e) {
    $("walletMsg").innerHTML = '<div class="msg err">' + esc(e.message) + "</div>";
  }
  btn.disabled = false;
});

init();
</script>
</body>
</html>
